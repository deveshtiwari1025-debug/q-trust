# Hosted-mode override: while the API still runs locally (planner, scanner and
# the indexer live on this machine), its Postgres connection is redirected to
# the hosted database so the Vercel serverless API and the local indexer share
# one database. Set QTRUST_COMPOSE_PG_URL in .env to enable; without it, the
# base compose file's local Postgres is used.
services:
  api:
    environment:
      - QTRUST_PG_URL=${QTRUST_COMPOSE_PG_URL:?QTRUST_COMPOSE_PG_URL must be set in .env}
